name: Build Notepad++ (x86)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Notepad++ Win32
        run: |
          msbuild PowerEditor\visual.net\notepadPlus.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=Win32

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepadpp-x86
          path: |
            PowerEditor\bin\*
            
